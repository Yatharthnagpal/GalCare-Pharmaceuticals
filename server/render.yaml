services:
  - type: web
    name: galcare-api
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://galcare.com,https://www.galcare.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ALERT_EMAIL_SALES
        value: sales@galcare.com
      - key: ALERT_EMAIL_CAREERS
        value: careers@galcare.com
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@galcare.com
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
